<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="crewbox-token" content="__CREWBOX_TOKEN__" />
  <title>Crewbox</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='9' width='26' height='18' rx='5' fill='%236d5efc'/%3E%3Ccircle cx='12' cy='18' r='3' fill='white'/%3E%3Ccircle cx='20' cy='18' r='3' fill='white'/%3E%3Crect x='13' y='3' width='6' height='7' rx='2' fill='%236d5efc'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><rect x="3" y="9" width="26" height="18" rx="5" fill="var(--accent)"/><circle cx="12" cy="18" r="3" fill="#fff"/><circle cx="20" cy="18" r="3" fill="#fff"/><rect x="13" y="3" width="6" height="7" rx="2" fill="var(--accent)"/></svg>
      <span>Crewbox</span>
      <small class="muted">your AI coworkers, on your machine</small>
    </div>
    <nav class="top-actions">
      <button class="ghost" data-action="inbox" title="Everything waiting for you">To handle <span class="badge" id="pending-count" hidden></span></button>
      <button class="ghost" data-action="notifications" title="Notifications">🔔 <span class="badge" id="unread-count" hidden></span></button>
      <button class="ghost" data-action="templates">Templates</button>
      <button class="ghost" data-action="knowledge">Knowledge base</button>
      <button class="ghost" data-action="settings">Settings</button>
      <button class="primary" data-action="new-agent">+ Coworker</button>
    </nav>
  </header>
  <main id="board" class="board" aria-live="polite"></main>
  <aside id="panel" class="panel" hidden></aside>
  <div id="modal-root"></div>
  <div id="toasts" class="toasts" role="status"></div>
  <script type="module" src="/assets/app.js"></script>
</body>
</html>
